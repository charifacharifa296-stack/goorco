<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </radialGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79482f"/>
      <stop offset="100%" stop-color="#5a311b"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Clothes / Collar -->
  <path d="M28 116 Q60 96 92 116 Z" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <path d="M50 102 Q60 110 70 102" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Neck -->
  <rect x="52" y="80" width="16" height="22" rx="6" fill="url(#skinGrad)"/>
  <!-- Hair Bun/Back -->
  <ellipse cx="60" cy="35" rx="28" ry="22" fill="url(#hairGrad)"/>
  <circle cx="60" cy="22" r="16" fill="url(#hairGrad)"/>
  <!-- Head -->
  <ellipse cx="60" cy="64" rx="23" ry="25" fill="url(#skinGrad)"/>
  <!-- Hair Front Bangs / Texture -->
  <path d="M37 54 C38 40, 52 38, 60 41 C68 38, 82 40, 83 54 C78 48, 68 47, 60 50 C52 47, 42 48, 37 54 Z" fill="url(#hairGrad)"/>
  <!-- Eyebrows -->
  <path d="M44 55 Q51 51 56 54" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M64 54 Q69 51 76 55" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Eyes -->
  <ellipse cx="49" cy="62" rx="4" ry="4.5" fill="#1c1917"/>
  <circle cx="50.5" cy="60.5" r="1.5" fill="#ffffff"/>
  <ellipse cx="71" cy="62" rx="4" ry="4.5" fill="#1c1917"/>
  <circle cx="72.5" cy="60.5" r="1.5" fill="#ffffff"/>
  <!-- Eyelashes -->
  <path d="M45 59 L43 57 M75 59 L77 57" stroke="#1c1917" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M58 67 Q60 70 62 67" stroke="#452110" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Smile -->
  <path d="M50 75 Q60 84 70 75" stroke="#452110" stroke-width="2" stroke-linecap="round" fill="#991b1b"/>
  <path d="M53 76 Q60 80 67 76" fill="#ffffff"/>
  <!-- Pearl Earrings -->
  <circle cx="37" cy="68" r="3" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8"/>
  <circle cx="83" cy="68" r="3" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8"/>
</svg>